[project]
name = "doomscroll"
version = "0.1.0"
description = "Gaze/head-tracking content-aware auto-scroll"
requires-python = ">=3.11,<3.13"
dependencies = [
    "opencv-contrib-python>=4.10",
    "mediapipe==0.10.21",
    "numpy",
    "scikit-learn",
    "mss",
    "pydantic>=2",
    "platformdirs",
    "loguru",
]

[project.optional-dependencies]
windows = ["pywin32"]
macos = ["pyobjc-framework-Quartz", "pyobjc-framework-Cocoa"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
