[project]
name = "doomscroll"
version = "0.1.0"
description = "Gaze/head-tracking content-aware auto-scroll"
requires-python = ">=3.11,<3.13"
dependencies = [
    "opencv-contrib-python>=4.10",
    "mediapipe==0.10.21",
    "numpy",
    "scikit-learn",
    "mss",
    "pydantic>=2",
    "platformdirs",
    "loguru",
]

[project.optional-dependencies]
windows = ["pywin32"]
macos = ["pyobjc-framework-Quartz", "pyobjc-framework-Cocoa", "pyobjc-framework-Vision"]
# Needed only for scripts/calibrate.py and scripts/phase2_gaze_scroll.py's
# `--features l2cs` flag (src/doomscroll/gaze/l2cs_backend.py) -- the default
# `--features handcrafted` needs none of this. Same pins as the `ml` dev
# group below (used by offline research/comparison scripts outside this
# repo); duplicated here as a real install extra, not a dev group, because
# this one is meant for end users who want the live app to use it, via
# `uv sync --extra l2cs` / `pip install .[l2cs]`.
l2cs = ["safetensors>=0.8.0", "torch>=2.14.1", "torchvision>=0.29.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8.0"]
ml = [
    "safetensors>=0.8.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
