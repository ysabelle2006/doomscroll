[project]
name = "doomscroll"
version = "0.1.0"
description = "Gaze/head-tracking content-aware auto-scroll"
requires-python = ">=3.11"
dependencies = [
    "opencv-contrib-python>=4.10",
    "mediapipe>=0.10.18",
    "numpy",
    "scikit-learn",
    "mss",
    "pynput",  # global cursor position for data collection
    "joblib",
    "pydantic>=2",
    "platformdirs",
    "loguru",
    "pandas>=2.3.3",
]

[project.optional-dependencies]
windows = ["pywin32"]
macos = ["pyobjc-framework-Quartz", "pyobjc-framework-Cocoa", "pyobjc-framework-Vision"]
cnn = ["torch>=2.2"]  # only for scripts/train_cnn.py and running the CNN model

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
